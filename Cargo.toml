[package]
name = "demucs-core-native"
version = "0.1.0"
edition = "2021"
description = "Hand-written CUDA + CPU inference engines for HTDemucs v4 (no burn)"
license = "MIT"
repository = "https://github.com/eclipse005/demucs-native-rs"
readme = "README.md"
keywords = ["demucs", "audio", "source-separation", "cuda", "music"]
categories = ["multimedia::audio"]

[features]
# Default is CPU-only so macOS / Linux without CUDA Toolkit can build and ship
# the CLI. Enable GPU with: cargo build --release --features cuda
default = []
cuda = ["dep:cudarc"]
cpu = []

[dependencies]
half = "2"
safetensors = "0.5"
realfft = "3.5.0"
gemm = "0.18"
rayon = "1.10"
anyhow = "1"
thiserror = "2"
log = "0.4"
libm = "0.2"
hound = "3"

# CUDA backend (optional). Detect toolkit version from nvcc at build time so
# CI / local boxes with any CUDA 12.x install work without hardcoding 12.8.
cudarc = { version = "0.19", features = ["cublas", "f16", "cuda-version-from-build-system"], optional = true }

[dev-dependencies]
pollster = "0.4"
bytemuck = "1"

[[bin]]
name = "demucs-native"
path = "src/bin/demucs_native.rs"
